# Wrangler Configuration Template
# Deployment template: customize only for an approved staging/production release.
# For local development run: pnpm --filter @vocab/backend setup:local
# This template includes remote Workers AI; do not copy it for local smoke tests.

name = "ai-vocab-app"
main = "src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

# [Static Assets] Serve the built Vue SPA from frontend/../assets (via Vite build.outDir)
[assets]
directory = "../assets"
binding = "ASSETS"

# [Secrets] Must be set via `wrangler secret put`:
#   - ENCRYPTION_KEY: AES-256 root key for encrypting sensitive D1 system_settings
#   - JWT_SECRET: JWT signing/verification key (if auth is enabled)
#
# D1 admin settings allow only AI_KEYS, AI_ENDPOINT_URL, AI_MODEL_NAME, AI_MODEL_OPTIONS.
# GET returns metadata only; secret replacements are server-encrypted.

# [Trusted runtime configuration] Replace with the real canonical HTTPS application origin.
[vars]
PUBLIC_APP_ORIGIN = "https://replace-before-release.example.invalid"
ENVIRONMENT = "production"
# Custom provider origins require deployment review; D1 endpoint changes cannot add trust.
AI_PROVIDER_ORIGINS = "https://api.openai.com"

# [KV] Cache layer only — stores AI response cache with 24h TTL.
# App settings are stored in D1, NOT in KV.
[[kv_namespaces]]
binding = "CACHE"
id = "<KV_APP_ID>"
preview_id = "<KV_APP_PREVIEW_ID>"

# [D1] SQL database for users, tokens, learned pairs, system_settings, fallback pairs
[[d1_databases]]
binding = "DB"
database_name = "<D1_DATABASE_NAME>"
database_id = "<D1_DATABASE_ID>"
migrations_dir = "migrations"

# [Rate Limit] General API guard (DDoS / abuse protection on generate endpoint)
[[ratelimits]]
name = "RATE_LIMITER_API"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# [Rate Limit] Strict guard on auth (magic link request, verify) to prevent email-bombing
[[ratelimits]]
name = "RATE_LIMITER_AUTH"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# Workers AI is a remote, potentially billable binding. Configure only with approval.
[ai]
binding = "AI"
