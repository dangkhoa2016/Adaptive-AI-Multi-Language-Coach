name = "ai-vocab-app-test"
main = "src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "CACHE"
id = "test_cache_kv"

[[d1_databases]]
binding = "DB"
database_name = "ai_vocab_db_test"
database_id = "test_d1_db"
migrations_dir = "migrations"

[[ratelimits]]
name = "RATE_LIMITER_API"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_AUTH"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
