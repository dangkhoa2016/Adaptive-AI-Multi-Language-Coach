name = "ai-vocab-app"
main = "src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

# [Static Assets] Serve the built Vue SPA from frontend/dist (mounted at ../assets via Vite build.outDir)
[assets]
directory = "../assets"
binding = "ASSETS"

# [Vars] Non-secret environment variables
[vars]
EMAIL_FROM = "no-reply@yourdomain.com"
EMAIL_FROM_NAME = "AI Vocab App"
# Default provider selection: 'database_dynamic' means read CSV from system_settings.force_email_provider in D1
EMAIL_PROVIDER = "database_dynamic"
AWS_REGION = "us-east-1"

# [KV] Cache layer for the AI vocab generation API
[[kv_namespaces]]
binding = "CACHE"
id = "xxxx_cache_kv_id_production"
preview_id = "xxxx_cache_kv_id_local"

# [D1] SQL database for users, magic tokens, learned pairs, provider config
[[d1_databases]]
binding = "DB"
database_name = "ai_vocab_db"
database_id = "xxxx_d1_database_id_production"
migrations_dir = "migrations"

# [Rate Limit] General API guard (DDoS / abuse protection on AI endpoints)
[[ratelimits]]
name = "RATE_LIMITER_API"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# [Rate Limit] Strict guard on auth (magic link request, verify) to prevent email-bombing
[[ratelimits]]
name = "RATE_LIMITER_AUTH"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
